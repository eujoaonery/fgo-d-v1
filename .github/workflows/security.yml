name: Security

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Semgrep (optional)
        continue-on-error: true
        run: npx --yes semgrep@1 --config p/default --error --exclude node_modules --exclude dist .
